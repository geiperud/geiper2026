<style>
/* ══════════════════════════════════════════════
   GEOVISOR — Estilos exclusivos (no modifica styles.css)
   ══════════════════════════════════════════════ */

/* Reset de página completa para modo app */
html, body {
  height: 100%;
  overflow: hidden;
}

/* ── Wrapper principal ───────────────────────── */
.geo-wrapper {
  display: flex;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  padding-top: 66px; /* altura real del navbar (15px*2 padding + 36px logo) */
  overflow: hidden;
  font-family: 'Montserrat', sans-serif;
}

/* ════════════════════════════════════════════
   SIDEBAR IZQUIERDA
   ════════════════════════════════════════════ */
.geo-sidebar {
  width: 380px;
  min-width: 380px;
  background: #ffffff;
  border-right: 1px solid #e2e8f0;
  box-shadow: 2px 0 8px rgba(0,0,0,0.05);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 5;
}

/* Encabezado sidebar */
.geo-sidebar-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}

.geo-sidebar-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 2px;
  color: #94a3b8;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}

/* Buscador */
.geo-search-wrap {
  position: relative;
  margin-bottom: 10px;
}

.geo-search-wrap i {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: #94a3b8;
  font-size: 12px;
  pointer-events: none;
}

#searchInput {
  width: 100%;
  padding: 8px 10px 8px 30px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  font-size: 12px;
  font-family: 'Montserrat', sans-serif;
  color: #334155;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

#searchInput:focus {
  border-color: #1D9E75;
  box-shadow: 0 0 0 3px rgba(29,158,117,0.1);
}

/* Lista de proyectos (agrupados por línea de investigación) */
.geo-proj-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.geo-proj-list::-webkit-scrollbar { width: 4px; }
.geo-proj-list::-webkit-scrollbar-track { background: transparent; }
.geo-proj-list::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }

/* Cabecera de línea de investigación (colapsable) */
.geo-linea-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  text-align: left;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'Montserrat', sans-serif;
}

.geo-linea-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.geo-linea-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

.geo-linea-name {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.35;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.geo-linea-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  margin-left: 8px;
}

.geo-linea-count {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 10px;
  background: rgba(255,255,255,0.55);
}

.geo-linea-chevron {
  font-size: 14px;
  transition: transform 0.15s;
}
.geo-linea-chevron.open { transform: rotate(180deg); }

/* Panel expandido con las tarjetas de proyectos de esa línea */
.geo-linea-projects {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 6px 0 2px 14px;
}

.geo-linea-empty {
  font-size: 12px;
  color: #94a3b8;
  padding: 6px 12px 2px;
  font-style: italic;
}

/* Tarjeta de proyecto individual */
.geo-proj-card {
  padding: 11px 13px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-left: 3px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
}

.geo-proj-card:hover {
  background: #f8fafc;
  border-color: #e2e8f0;
  filter: brightness(0.97);
}

.geo-proj-card.active {
  background: #ffffff;
  box-shadow: 0 0 0 1px currentColor inset;
}

.geo-proj-name {
  font-size: 13px;
  font-weight: 600;
  color: #1e293b;
  line-height: 1.4;
  margin-bottom: 5px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.geo-proj-meta {
  font-size: 11px;
  color: #64748b;
  line-height: 1.4;
}

.geo-proj-year {
  color: #94a3b8;
}

/* Pie de sidebar */
.geo-sidebar-footer {
  padding: 10px 16px;
  background: #f8fafc;
  border-top: 1px solid #e2e8f0;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  color: #94a3b8;
}

/* ════════════════════════════════════════════
   ÁREA DEL MAPA
   ════════════════════════════════════════════ */
.geo-map-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  min-height: 0;
  min-width: 0;
}

#mapCanvas {
  position: relative;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

#map {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #f9fafb;
}

/* Ocultar controles nativos de OL */
.ol-zoom,
.ol-attribution { display: none !important; }

/* ScaleLine — ahora renderizada DENTRO de #scaleTarget en la barra inferior,
   en vez de flotar de forma independiente (ol.control.ScaleLine target option) */
.ol-scale-line {
  position: static !important;
  background: transparent !important;
  border: none !important;
  padding: 0 !important;
  font-size: 10px !important;
  color: #475569 !important;
  font-family: 'Montserrat', sans-serif !important;
}

.ol-scale-line-inner {
  border: 1.5px solid #94a3b8 !important;
  border-top: none !important;
  color: #475569 !important;
  font-size: 9.5px !important;
  font-family: 'Montserrat', sans-serif !important;
}

/* ── Badge de proyecto activo ─────────────── */
.geo-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 10;
  background: rgba(255,255,255,0.82);
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  padding: 10px 14px;
  pointer-events: none;
  transition: opacity 0.2s;
  min-width: 200px;
  max-width: 340px;
}

.geo-badge.hidden { opacity: 0; }

.geo-badge-title {
  font-size: 13px;
  font-weight: 700;
  color: #0F6E56;
  line-height: 1.35;
  margin-bottom: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.geo-badge-sub {
  font-size: 10.5px;
  font-weight: 500;
  color: #64748b;
  line-height: 1.4;
}

/* ── Riel derecho unificado: controles + Turf ── */
.map-right-rail {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 16px; /* separación proporcional entre grupos */
}

.geo-controls {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.geo-controls .sep {
  height: 4px;
}

.geo-btn {
  width: 34px;
  height: 34px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #64748b;
  font-size: 13px;
  transition: all 0.15s;
}

.geo-btn:hover {
  background: #f0fdf4;
  color: #0F6E56;
  border-color: #86efac;
  transform: scale(1.05);
}

.geo-btn.active {
  background: #f0fdf4;
  color: #0F6E56;
  border-color: #86efac;
}

/* Popover del selector de mapa base */
.basemap-pop {
  position: absolute;
  z-index: 11;
  width: 168px;
  background: rgba(255,255,255,0.82);
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.18);
  padding: 8px;
}
.basemap-pop-title {
  font-size: 9px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: #94a3b8; margin-bottom: 6px; padding: 0 4px;
}
.bm-option {
  display: flex; align-items: center; gap: 8px;
  padding: 6px; border-radius: 7px; cursor: pointer;
  font-size: 11.5px; color: #334155;
  position: relative;
}
.bm-option:hover { background: #f8fafc; }
.bm-option.active { background: #f0fdf4; color: #0F6E56; font-weight: 600; }
.bm-thumb { width: 28px; height: 20px; border-radius: 4px; flex-shrink: 0; border: 1.5px solid rgba(0,0,0,0.08); }
.bm-thumb.osm { background: linear-gradient(135deg,#cfe8d8,#a8d5bb); }
.bm-thumb.sat { background: linear-gradient(135deg,#2d4a3e,#1a3328); }
.bm-thumb.blank { background: #f1f5f9; }
.bm-check { margin-left: auto; color: #0F6E56; font-size: 10px; display: none; }
.bm-option.active .bm-check { display: inline-block; }

.bm-info-link {
  display: flex; align-items: center; gap: 6px;
  margin-top: 6px; padding-top: 8px;
  border-top: 1px solid #eef1f6;
  font-size: 10px; color: #94a3b8;
  text-decoration: none;
}
.bm-info-link:hover { color: #0F6E56; }

/* ── Panel de análisis espacial (Turf.js) — MISMO tamaño/estilo que .geo-btn ── */
.turf-rail {
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: rgba(255,255,255,0.82);
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}

.turf-btn {
  width: 34px;
  height: 34px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #64748b;
  font-size: 13px;
  transition: all 0.15s;
}

.turf-btn:hover {
  background: #f0fdf4;
  color: #0F6E56;
  border-color: #86efac;
}

.turf-btn.active {
  background: #0F6E56;
  color: #ffffff;
  border-color: #0F6E56;
  box-shadow: 0 2px 8px rgba(15,110,86,0.35);
}

.turf-panel {
  position: absolute;
  right: 62px;
  z-index: 11;
  width: 268px;
  max-width: calc(100% - 90px);
  background: rgba(255,255,255,0.82);
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.14);
  padding: 14px 16px;
  display: none;
}

.turf-panel.open { display: block; }

.turf-panel-close {
  position: absolute;

  top: 8px;
  right: 8px;
  width: 22px;
  height: 22px;
  border: none;
  background: transparent;
  color: #94a3b8;
  cursor: pointer;
  font-size: 12px;
  border-radius: 6px;
}
.turf-panel-close:hover { background: #f1f5f9; color: #475569; }

.turf-panel-eyebrow {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #0F6E56;
  margin-bottom: 2px;
}

.turf-panel-title {
  font-size: 15px;
  font-weight: 700;
  color: #1e293b;
  margin-bottom: 8px;
  padding-right: 20px;
}

.turf-panel-desc {
  font-size: 12px;
  line-height: 1.5;
  color: #64748b;
  margin-bottom: 10px;
}

.turf-panel-hint {
  font-size: 11.5px;
  line-height: 1.45;
  color: #0F6E56;
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-radius: 8px;
  padding: 8px 10px;
  margin-bottom: 10px;
}

.turf-panel-result {
  font-size: 12.5px;
  line-height: 1.55;
  color: #1e293b;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 10px 12px;
}
.turf-panel-result b { color: #0F6E56; }

.turf-panel-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.turf-panel-row input[type="number"] {
  width: 64px;
  padding: 5px 7px;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  font-size: 12px;
  font-family: inherit;
}
.turf-panel-row button {
  flex: 1;
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  background: #0F6E56;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.turf-panel-row button:hover { background: #0b543f; }

@media (max-width: 720px) {
  .map-right-rail { right: 8px; }
  .turf-panel { right: 8px; top: auto !important; bottom: 64px; width: calc(100% - 16px); max-width: none; }
}

/* ── Buscador de municipios ──────────────── */
.muni-search-wrap {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 12;
  width: 280px;
  max-width: calc(100% - 180px);
}

.muni-search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.82);
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  padding: 8px 12px;
}
.muni-search-box i { color: #94a3b8; font-size: 12px; }
.muni-search-box input {
  border: none;
  outline: none;
  background: transparent;
  font-size: 12.5px;
  font-family: inherit;
  color: #1e293b;
  width: 100%;
}
.muni-search-box input::placeholder { color: #94a3b8; }

.muni-info-btn {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border: none;
  background: transparent;
  color: #94a3b8;
  cursor: pointer;
  font-size: 13px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.muni-info-btn:hover { background: #f1f5f9; color: #0F6E56; }

.muni-search-results {
  margin-top: 4px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  max-height: 240px;
  overflow-y: auto;
  display: none;
}
.muni-search-results.open { display: block; }

.muni-result-item {
  padding: 8px 12px;
  font-size: 12px;
  cursor: pointer;
  border-bottom: 1px solid #f1f5f9;
}
.muni-result-item:last-child { border-bottom: none; }
.muni-result-item:hover { background: #f0fdf4; }
.muni-result-name { font-weight: 600; color: #1e293b; }
.muni-result-depto { color: #94a3b8; font-size: 10.5px; }

.muni-search-empty {
  padding: 10px 12px;
  font-size: 11.5px;
  color: #94a3b8;
}

.muni-search-hint {
  text-align: center;
  margin-top: 4px;
  font-size: 10px;
  color: rgba(255,255,255,0.85);
  text-shadow: 0 1px 3px rgba(0,0,0,0.45);
}

/* ── Badge de municipio(s) seleccionado(s) ─────── */
.muni-badge {
  position: absolute;
  top: 66px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 11;
  display: none;
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  max-width: calc(100% - 180px);
  max-height: calc(100% - 90px);
  overflow-y: auto;
}
.muni-badge.open { display: flex; }

.muni-card {
  flex: 0 0 auto;
  width: 220px;
  position: relative;
  background: rgba(255,255,255,0.82);
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);

.muni-card-name {

}
.muni-card-depto {
  font-size: 10.5px;

.muni-badge-clearall {

/* ── Barra inferior unificada: escala · proveedor · coordenadas ── */

  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  align-items: center;
  background: rgba(255,255,255,0.82);
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  padding: 6px 4px;
  font-size: 11px;
  color: #475569;
  white-space: nowrap;
  max-width: calc(100% - 24px);
}
.bib-section { display: flex; align-items: center; gap: 6px; padding: 0 12px; }
.bib-sep { width: 1px; align-self: stretch; background: #e2e8f0; }

.geo-popup-container {

.geo-popup {
  background: #ffffff;

  border-radius: 10px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.15);

  max-width: 280px;
  overflow: hidden;
}

.geo-popup::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 16px;
  height: 8px;
  background: #ffffff;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  border-left: 1px solid #e2e8f0;
  border-right: 1px solid #e2e8f0;

.geo-popup-header {

}

.geo-popup-body {

.geo-popup-table {

}

/* ══════════════════════════════════════════════
   MARCADORES DE UBICACIÓN EN EL MAPA
   Solo los trabajos con área geográfica definida en el título
   reciben marcador, coloreado según la línea de investigación
   a la que pertenece su proyecto. Cada marcador abre un popup
   con el nombre del trabajo como hipervínculo (por ahora, al
   RIUD general).
   ══════════════════════════════════════════════ */
const PROJECT_MARKERS = [
  { proyectoId: 1, lugar: 'Vereda Termales, Vista Hermosa (Meta)', coords: [-73.7625, 3.1486] },
  { proyectoId: 2, lugar: 'Arbeláez (Cundinamarca)',  coords: [-74.4200, 4.2700] },
  { proyectoId: 2, lugar: 'La Mesa (Cundinamarca)',   coords: [-74.4625, 4.6303] },
  { proyectoId: 2, lugar: 'Tocancipá (Cundinamarca)', coords: [-73.9167, 4.9667] },
];

/* ══════════════════════════════════════════════
   ESTADO GLOBAL
   ══════════════════════════════════════════════ */
let activeProject  = null;
let activeLayerId  = null;
let openLineaId    = null;
let vectorLayer    = null;
let colombiaBorderLayer = null;
let projectMarkersLayer = null;
let map, osmLayer, satLayer, view;
let toastTimer     = null;
let currentBasemap = 'sat';

/* ══════════════════════════════════════════════
   INIT MAP
   ══════════════════════════════════════════════ */
function initMap() {
  osmLayer = new ol.layer.Tile({ source: new ol.source.OSM(), visible: false });

  /* Mapa base satelital: Sentinel-2 Cloudless (EOX IT Services GmbH), mosaico
     construido a partir de datos abiertos Copernicus/ESA — CC BY 4.0.
     Reemplaza a Esri World Imagery (comercial) para mantener el geovisor
     100% sobre datos y servicios abiertos. Resolución nativa ~10 m/px. */
  const SAT_LAYER_YEAR = '2024';
  satLayer = new ol.layer.Tile({
    source: new ol.source.XYZ({
      url: 'https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-' + SAT_LAYER_YEAR + '_3857/default/g/{z}/{y}/{x}.jpg',
      attributions: 'Sentinel-2 cloudless by <a href="https://s2maps.eu" target="_blank" rel="noopener">EOX IT Services GmbH</a> (Contains modified Copernicus Sentinel data ' + SAT_LAYER_YEAR + ')',
      maxZoom: 14
    }),
    visible: true
  });

  /* Vista inicial: encuadre de todo el país (Colombia continental) */
  const COLOMBIA_EXTENT_LONLAT = [-78.990935, -4.298187, -66.876326, 12.437303];
  view = new ol.View({
    center: ol.proj.fromLonLat([-74.0721, 4.7110]),
    zoom: 5,
    minZoom: 4,
    maxZoom: 19
  });

  /* Borde nacional de Colombia (capa de referencia, siempre por encima de los basemaps) */
  colombiaBorderLayer = new ol.layer.Vector({
    source: new ol.source.Vector({
      url: '../data/colombia_border.geojson',
      format: new ol.format.GeoJSON()
    }),
    style: new ol.style.Style({
      stroke: new ol.style.Stroke({ color: '#FFCC00', width: 2 }),
      fill: null
    }),
    zIndex: 1
  });

  /* Marcadores de ubicación de los trabajos de grado con área geográfica definida */
  const markerFeatures = PROJECT_MARKERS.map(function (m) {
    const proj  = PROJECTS.find(p => p.id === m.proyectoId);
    const linea = LINEAS.find(l => l.id === proj.lineaId);
    const feat = new ol.Feature({
      geometry: new ol.geom.Point(ol.proj.fromLonLat(m.coords))
    });
    feat.set('isProjectMarker', true);
    feat.set('nombre', proj.nombre);
    feat.set('autor', proj.autor);
    feat.set('lugar', m.lugar);
    feat.set('url', proj.url);
    feat.set('lineaColor', linea ? linea.color : '#dc2626');
    feat.set('lineaNombre', linea ? linea.nombre : '');
    return feat;
  });

  projectMarkersLayer = new ol.layer.Vector({
    source: new ol.source.Vector({ features: markerFeatures }),
    style: function (feature) {
      return new ol.style.Style({
        image: new ol.style.Circle({
          radius: 6,
          fill:   new ol.style.Fill({ color: feature.get('lineaColor') }),
          stroke: new ol.style.Stroke({ color: '#ffffff', width: 1.5 })
        })
      });
    },
    zIndex: 3
  });

  map = new ol.Map({
    target: 'map',
    layers: [osmLayer, satLayer, colombiaBorderLayer, projectMarkersLayer],
    view: view,
    controls: []
  });
  map.addControl(new ol.control.ScaleLine({
    units: 'metric',
    target: document.getElementById('scaleTarget')
  }));

  /* Coordenadas del cursor: formato decimal o sexagesimal (DMS), a elección
     del usuario, recordado entre sesiones vía localStorage. */
  let coordFormat = localStorage.getItem('geiper_coord_format') || 'decimal';
  let lastCoord = null;

  function toDMS(deg) {
    let abs = Math.abs(deg);
    let d = Math.floor(abs);
    let mFloat = (abs - d) * 60;
    let m = Math.floor(mFloat);
    let s = (mFloat - m) * 60;
    s = Math.round(s * 10) / 10;
    if (s >= 60) { s -= 60; m += 1; }
    if (m >= 60) { m -= 60; d += 1; }
    return d + '\u00b0' + m + "'" + s.toFixed(1) + '"';
  }

  function renderCoords(coord) {
    const lonDir = coord[0] >= 0 ? 'E' : 'W';
    const latDir = coord[1] >= 0 ? 'N' : 'S';
    const el = document.getElementById('geoCoords');
    if (coordFormat === 'dms') {
      el.textContent = toDMS(coord[1]) + latDir + '\u00a0\u00a0' + toDMS(coord[0]) + lonDir;
    } else {
      el.textContent = Math.abs(coord[1]).toFixed(4) + '\u00b0 ' + latDir + '\u00a0\u00a0\u00a0' + Math.abs(coord[0]).toFixed(4) + '\u00b0 ' + lonDir;
    }
  }

  function updateCoordToggleLabel() {
    document.getElementById('bibCoordToggle').textContent = coordFormat === 'dms' ? '° ⇄' : 'DMS ⇄';
  }
  updateCoordToggleLabel();

  document.getElementById('bibCoordToggle').addEventListener('click', function () {
    coordFormat = coordFormat === 'dms' ? 'decimal' : 'dms';
    localStorage.setItem('geiper_coord_format', coordFormat);
    updateCoordToggleLabel();
    if (lastCoord) renderCoords(lastCoord);
  });

  map.on('pointermove', function (evt) {
    lastCoord = ol.proj.toLonLat(evt.coordinate);
    renderCoords(lastCoord);
  });

  /* Click en feature → popup */
  map.on('singleclick', function (evt) {
    /* Si hay una herramienta de análisis espacial activa en modo de
       selección (Turf.js), ese clic se dedica a la herramienta y no
       debe abrir el popup normal de proyecto. */
    if (window.TurfPanel && window.TurfPanel.handleMapClick(evt)) return;
    if (window.MunicipioSearch && window.MunicipioSearch.handleMapClick(evt)) return;

    const popup = document.getElementById('geoPopup');
    let found   = false;

    map.forEachFeatureAtPixel(evt.pixel, function (feature) {
      if (found) return;
      found = true;

      const props = feature.getProperties();
      const geom  = feature.getGeometry();
      let pixel;

      if (geom.getType() === 'Point') {
        pixel = map.getPixelFromCoordinate(geom.getCoordinates());
      } else if (geom.getType() === 'LineString') {
        const coords = geom.getCoordinates();
        const mid    = coords[Math.floor(coords.length / 2)];
        pixel = map.getPixelFromCoordinate(mid);
      } else {
        const ext = geom.getExtent();
        const ctr = ol.extent.getCenter(ext);
        pixel = map.getPixelFromCoordinate(ctr);
      }

      const table = document.getElementById('popupTable');
      table.innerHTML = '';

      if (props.isProjectMarker) {
        /* ── Popup de marcador de trabajo de grado: nombre como hipervínculo ── */
        document.getElementById('popupTitle').textContent = props.lugar;
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 2;
        cell.innerHTML =
          '<span style="display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;margin-bottom:6px;background:' + escHtml(props.lineaColor) + '22;color:' + escHtml(props.lineaColor) + ';">' +
            escHtml(props.lineaNombre) +
          '</span><br>' +
          '<a href="' + escHtml(props.url) + '" target="_blank" rel="noopener noreferrer" style="color:#1e293b;font-weight:600;font-size:13px;line-height:1.4;">' +
            escHtml(props.nombre) +
          '</a><br><span style="color:#64748b;font-size:11px;">' + escHtml(props.autor) + '</span>';
        row.appendChild(cell);
        table.appendChild(row);
      } else {
        /* Título del popup */
        const layerName = activeProject
          ? (activeProject.capas.find(c => c.id === props['__layer']) || { nombre: 'Feature' }).nombre
          : 'Atributos';
        document.getElementById('popupTitle').textContent = layerName;

        /* Tabla de atributos */
        Object.entries(props).forEach(function ([k, v]) {
          if (k === '__layer' || k === 'geometry') return;
          const row = document.createElement('tr');
          row.innerHTML = '<td>' + escHtml(k) + '</td><td>' + escHtml(String(v)) + '</td>';
          table.appendChild(row);
        });
      }

      /* Posicionar popup */
      popup.style.left = pixel[0] + 'px';
      popup.style.top  = pixel[1] + 'px';
      popup.style.display = 'block';
    }, {
      hitTolerance: 8,
      layerFilter: function (layer) { return layer !== colombiaBorderLayer; }
    });

    if (!found) {
      document.getElementById('geoPopup').style.display = 'none';
    }
  });

  /* Cerrar popup */
  document.getElementById('popupClose').addEventListener('click', function () {
    document.getElementById('geoPopup').style.display = 'none';
  });
}

/* Escapar HTML para evitar XSS */
function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ══════════════════════════════════════════════
   CARGAR PROYECTO
   ══════════════════════════════════════════════ */
function loadProject(proj) {
  activeProject = proj;
  activeLayerId = proj.capas.length ? proj.capas[0].id : null;
  openLineaId   = proj.lineaId;

  /* Ocultar popup */
  document.getElementById('geoPopup').style.display = 'none';

  /* Badge */
  const linea = LINEAS.find(l => l.id === proj.lineaId);
  const badge = document.getElementById('geoBadge');
  badge.classList.remove('hidden');
  document.getElementById('badgeTitle').textContent = proj.nombre;
  document.getElementById('badgeSub').textContent =
    (linea ? linea.nombre : '') + ' · ' + proj.sensor + ' · ' + proj.año;

  /* Renderizar features */
  renderProjectFeatures(proj);

  /* Encuadrar */
  const ext3857 = ol.proj.transformExtent(proj.extent, 'EPSG:4326', 'EPSG:3857');
  view.fit(ext3857, { padding: [50, 50, 50, 50], duration: 700 });

  /* Panel derecho */
  renderPanel(proj);

  /* Marcar tarjeta activa */
  document.querySelectorAll('.geo-proj-card').forEach(function (el) {
    el.classList.toggle('active', parseInt(el.dataset.id) === proj.id);
  });
}

/* ══════════════════════════════════════════════
   RENDERIZAR FEATURES EN EL MAPA
   ══════════════════════════════════════════════ */
function renderProjectFeatures(proj) {
  if (vectorLayer) {
    map.removeLayer(vectorLayer);
    vectorLayer = null;
  }

  const gjFormat = new ol.format.GeoJSON({
    dataProjection:    'EPSG:4326',
    featureProjection: 'EPSG:3857'
  });

  const features = [];
  proj.features.forEach(function (f) {
    const capa = proj.capas.find(c => c.id === f.layer);
    if (!capa || !capa.visible) return;

    const olFeature = gjFormat.readFeature(f);
    olFeature.set('__layer', f.layer);
    olFeature.setStyle(buildStyle(f.geometry.type, capa.color));
    features.push(olFeature);
  });

  const source = new ol.source.Vector({ features: features });
  vectorLayer  = new ol.layer.Vector({ source: source });
  map.addLayer(vectorLayer);
}

/* ── Estilos por tipo de geometría ─────────── */
function buildStyle(type, color) {
  if (type === 'Point') {
    return new ol.style.Style({
      image: new ol.style.Circle({
        radius: 7,
        fill:   new ol.style.Fill({ color: color }),
        stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 })
      })
    });
  } else if (type === 'LineString') {
    return new ol.style.Style({
      stroke: new ol.style.Stroke({ color: color, width: 2.5 })
    });
  } else {
    /* Polygon */
    return new ol.style.Style({
      fill:   new ol.style.Fill({ color: color + '55' }),
      stroke: new ol.style.Stroke({ color: color, width: 1.5 })
    });
  }
}

/* ── Refrescar capas según visibilidad ─────── */
function refreshLayers() {
  if (!activeProject || !vectorLayer) return;
  const src = vectorLayer.getSource();
  src.clear();

  const gjFormat = new ol.format.GeoJSON({
    dataProjection:    'EPSG:4326',
    featureProjection: 'EPSG:3857'
  });

  activeProject.features.forEach(function (f) {
    const capa = activeProject.capas.find(c => c.id === f.layer);
    if (!capa || !capa.visible) return;
    const olFeature = gjFormat.readFeature(f);
    olFeature.set('__layer', f.layer);
    olFeature.setStyle(buildStyle(f.geometry.type, capa.color));
    src.addFeature(olFeature);
  });
}

/* ══════════════════════════════════════════════
   RENDERIZAR PANEL DERECHO
   ══════════════════════════════════════════════ */
function renderPanel(proj) {
  const bp = document.getElementById('bottomPanel');
  bp.style.display = 'flex';
  bp.classList.remove('collapsed');

  document.getElementById('bpProjName').textContent = proj.nombre;

  const hasCapas = proj.capas.length > 0;
  const linea = LINEAS.find(l => l.id === proj.lineaId);

  /* Los trabajos de grado son documentos, no datasets con capas propias:
     se ocultan las pestañas "Capas" y "Descargas" cuando no aplican, y
     se muestra "Metadatos" por defecto para no dejar espacios vacíos. */
  const tabCapasBtn = document.querySelector('.bp-tab[data-tab="capas"]');
  const tabDescargasBtn = document.querySelector('.bp-tab[data-tab="descargas"]');
  tabCapasBtn.style.display = hasCapas ? '' : 'none';
  tabDescargasBtn.style.display = hasCapas ? '' : 'none';

  document.querySelectorAll('.bp-tab').forEach(function (t) { t.classList.remove('active'); });
  document.querySelectorAll('.bp-tab-content').forEach(function (c) { c.style.display = 'none'; });
  const defaultTab = hasCapas ? 'capas' : 'metadatos';
  document.querySelector('.bp-tab[data-tab="' + defaultTab + '"]').classList.add('active');
  document.getElementById('tab-' + defaultTab).style.display = 'flex';

  /* ── TAB CAPAS ── */
  const ll = document.getElementById('bpLayerList');
  ll.innerHTML = '';
  proj.capas.forEach(function (capa) {
    const row = document.createElement('div');
    row.className = 'bp-layer-row' + (capa.id === activeLayerId ? ' selected' : '');
    row.innerHTML =
      '<div class="bp-layer-dot" style="background:' + capa.color + '"></div>' +
      '<span class="bp-layer-name">' + escHtml(capa.nombre) + '</span>' +
      '<label class="bp-toggle">' +
        '<input type="checkbox"' + (capa.visible ? ' checked' : '') + '>' +
        '<span class="bp-toggle-slider"></span>' +
      '</label>';
    row.addEventListener('click', function (e) {
      if (e.target.tagName === 'INPUT') return;
      activeLayerId = capa.id;
      renderPanel(activeProject);
      refreshLayers();
    });
    row.querySelector('input').addEventListener('change', function (e) {
      e.stopPropagation();
      capa.visible = e.target.checked;
      refreshLayers();
    });
    ll.appendChild(row);
  });

  const slider = document.getElementById('bpOpacitySlider');
  slider.value = vectorLayer ? Math.round(vectorLayer.getOpacity() * 100) : 100;
  document.getElementById('bpOpacityVal').textContent = slider.value + '%';

  /* ── TAB METADATOS ── */
  const metaRows = [
    { label: 'Autor', value: proj.autor },
    { label: 'Año', value: proj.año },
    { label: 'Línea de investigación', value: linea ? linea.nombre : '', color: linea ? linea.color : null },
    { label: 'Ubicación', value: proj.ubicacion },
    { label: 'Metodología', value: proj.sensor },
    { label: 'Escala', value: proj.escala },
    { label: 'CRS', value: proj.crs }
  ].filter(function (r) { return r.value && r.value !== 'N/A'; });

  document.getElementById('bpMetaTable').innerHTML = metaRows.map(function (r) {
    const valueHtml = r.color
      ? '<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:' + r.color + ';flex-shrink:0;"></span>' + escHtml(String(r.value)) + '</span>'
      : escHtml(String(r.value));
    return '<div class="bp-meta-field"><div class="bp-meta-label">' + r.label + '</div><div class="bp-meta-value">' + valueHtml + '</div></div>';
  }).join('');
  document.getElementById('bpVerDocumento').href = proj.url;

  /* ── TAB DESCARGAS ── */
  const dl = document.getElementById('bpDownloadList');
  dl.innerHTML = '';
  proj.capas.forEach(function (capa) {
    const item = document.createElement('div');
    item.className = 'bp-dl-item';
    item.innerHTML =
      '<div class="bp-dl-dot" style="background:' + capa.color + '"></div>' +
      '<span class="bp-dl-name">' + escHtml(capa.nombre) + '</span>' +
      '<select class="bp-dl-select">' +
        '<option value="">↓ Formato</option>' +
        '<option value="geojson">GeoJSON</option>' +
        '<option value="shp">SHP (ZIP)</option>' +
        '<option value="kml">KML</option>' +
        '<option value="csv">CSV</option>' +
      '</select>';
    item.querySelector('select').addEventListener('change', function () {
      if (!this.value) return;
      showToast('Descargando ' + capa.nombre + ' como ' + this.value.toUpperCase());
      var s = this;
      setTimeout(function () { s.value = ''; }, 1200);
    });
    dl.appendChild(item);
  });
}

/* ══════════════════════════════════════════════
   LISTA DE PROYECTOS (sidebar)
   ══════════════════════════════════════════════ */
function renderProjectList() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const list  = document.getElementById('projectList');
  list.innerHTML = '';

  /* Con búsqueda activa, solo se abren automáticamente las líneas con
     coincidencias; sin búsqueda, se respeta la línea que el usuario
     tenga abierta manualmente (openLineaId). */
  LINEAS.forEach(function (linea) {
    const proyectosLinea = PROJECTS.filter(function (p) {
      if (p.lineaId !== linea.id) return false;
      if (!query) return true;
      return p.nombre.toLowerCase().includes(query) ||
             p.autor.toLowerCase().includes(query) ||
             String(p.año).includes(query);
    });

    if (query && proyectosLinea.length === 0) return; /* oculta líneas sin coincidencias al buscar */

    const isOpen = query ? true : (openLineaId === linea.id);

    const header = document.createElement('button');
    header.className = 'geo-linea-header';
    header.style.background = linea.color + '15';
    header.style.color = linea.color;
    header.dataset.lineaId = linea.id;
    header.innerHTML =
      '<div class="geo-linea-left">' +
        '<span class="geo-linea-dot" style="background:' + linea.color + ';"></span>' +
        '<span class="geo-linea-name">' + escHtml(linea.nombre) + '</span>' +
      '</div>' +
      '<div class="geo-linea-right">' +
        '<span class="geo-linea-count">' + proyectosLinea.length + '</span>' +
        '<i class="fa-solid fa-chevron-down geo-linea-chevron' + (isOpen ? ' open' : '') + '"></i>' +
      '</div>';
    header.addEventListener('click', function () {
      openLineaId = (openLineaId === linea.id) ? null : linea.id;
      renderProjectList();
    });
    list.appendChild(header);

    if (isOpen) {
      const panel = document.createElement('div');
      panel.className = 'geo-linea-projects';

      if (proyectosLinea.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'geo-linea-empty';
        empty.textContent = 'Sin trabajos publicados aún en esta línea.';
        panel.appendChild(empty);
      } else {
        proyectosLinea.forEach(function (proj) {
          const card = document.createElement('div');
          card.className = 'geo-proj-card' + (activeProject && activeProject.id === proj.id ? ' active' : '');
          card.style.borderLeftColor = linea.color;
          if (activeProject && activeProject.id === proj.id) card.style.color = linea.color;
          card.dataset.id = proj.id;
          card.innerHTML =
            '<div class="geo-proj-name">' + escHtml(proj.nombre) + '</div>' +
            '<div class="geo-proj-meta">' + escHtml(proj.autor) + ' · <span class="geo-proj-year">' + proj.año + '</span></div>';
          card.addEventListener('click', function () { loadProject(proj); });
          panel.appendChild(card);
        });
      }
      list.appendChild(panel);
    }
  });

  /* Contador en footer */
  const totalMatch = LINEAS.reduce(function (acc, linea) {
    return acc + PROJECTS.filter(function (p) {
      if (p.lineaId !== linea.id) return false;
      if (!query) return true;
      return p.nombre.toLowerCase().includes(query) || p.autor.toLowerCase().includes(query) || String(p.año).includes(query);
    }).length;
  }, 0);
  document.getElementById('footerCount').textContent =
    totalMatch + ' proyecto' + (totalMatch !== 1 ? 's' : '') +
    ' · ' + LINEAS.length + ' líneas de investigación';
}

function showToast(msg) {
  const toast = document.getElementById('geoToast');
  document.getElementById('toastMsg').textContent = msg;
  clearTimeout(toastTimer);
  toast.classList.add('show');
  toastTimer = setTimeout(function () {
    toast.classList.remove('show');
  }, 3000);
}

/* ══════════════════════════════════════════════
   INICIALIZAR UI
   ══════════════════════════════════════════════ */
function initUI() {
  /* Buscador */
  document.getElementById('searchInput').addEventListener('keyup', renderProjectList);

  /* Zoom in / out */
  document.getElementById('btnZoomIn').addEventListener('click', function () {
    view.animate({ zoom: view.getZoom() + 1, duration: 250 });
  });
  document.getElementById('btnZoomOut').addEventListener('click', function () {
    view.animate({ zoom: view.getZoom() - 1, duration: 250 });
  });

  /* Volver a la vista de Colombia completa */
  document.getElementById('btnColombia').addEventListener('click', function () {
    const colExt3857 = ol.proj.transformExtent(
      [-78.990935, -4.298187, -66.876326, 12.437303],
      'EPSG:4326', 'EPSG:3857'
    );
    view.fit(colExt3857, { padding: [30, 30, 30, 30], duration: 600 });

    /* Limpiar proyecto activo */
    activeProject = null;
    activeLayerId = null;
    if (vectorLayer) { map.removeLayer(vectorLayer); vectorLayer = null; }
    document.getElementById('geoBadge').classList.add('hidden');
    document.getElementById('geoPopup').style.display = 'none';
    document.getElementById('bottomPanel').style.display = 'none';
    document.querySelectorAll('.geo-proj-card').forEach(function (c) { c.classList.remove('active'); });
    map.updateSize();
  });

  /* Pantalla completa */
  document.getElementById('btnFullscreen').addEventListener('click', function () {
    const container = document.querySelector('.geo-map-container');
    const fsIcon    = document.getElementById('fsIcon');
    if (!document.fullscreenElement) {
      container.requestFullscreen && container.requestFullscreen();
      fsIcon.classList.replace('fa-expand', 'fa-compress');
    } else {
      document.exitFullscreen && document.exitFullscreen();
      fsIcon.classList.replace('fa-compress', 'fa-expand');
    }
  });

  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement) {
      document.getElementById('fsIcon').classList.replace('fa-compress', 'fa-expand');
    }
  });

  /* ── Pestañas del panel inferior ── */
  document.querySelectorAll('.bp-tab').forEach(function (tab) {
    tab.addEventListener('click', function (e) {
      e.stopPropagation();
      document.querySelectorAll('.bp-tab').forEach(function (t) { t.classList.remove('active'); });
      document.querySelectorAll('.bp-tab-content').forEach(function (c) { c.style.display = 'none'; });
      this.classList.add('active');
      document.getElementById('tab-' + this.dataset.tab).style.display = 'flex';
    });
  });

  /* ── Colapsar/expandir topbar ── */
  document.querySelector('#bottomPanel .bp-topbar').addEventListener('click', function (e) {
    if (e.target.closest('.bp-tab') || e.target.closest('.bp-close')) return;
    document.getElementById('bottomPanel').classList.toggle('collapsed');
    map.updateSize();
  });

  /* ── Botón colapsar panel ── */
  document.getElementById('bpClose').addEventListener('click', function (e) {
    e.stopPropagation();
    document.getElementById('bottomPanel').classList.toggle('collapsed');
    map.updateSize();
  });

  /* ── Slider de opacidad del panel inferior ── */
  document.getElementById('bpOpacitySlider').addEventListener('input', function () {
    document.getElementById('bpOpacityVal').textContent = this.value + '%';
    if (vectorLayer) vectorLayer.setOpacity(this.value / 100);
  });

  /* ── Botón descarga completa ── */
  document.getElementById('bpBtnDlAll').addEventListener('click', function () {
    if (!activeProject) return;
    showToast('Preparando ZIP: ' + activeProject.nombre.substring(0, 28) + '...');
  });

  /* ── Selector global de mapa base (botón + popover) ── */
  const BASEMAP_LABELS = {
    osm:   'OpenStreetMap',
    sat:   'Sentinel-2 Cloudless · EOX/Copernicus',
    blank: 'Sin mapa base'
  };

  function setBasemap(value) {
    currentBasemap = value;
    osmLayer.setVisible(value === 'osm');
    satLayer.setVisible(value === 'sat');
    document.getElementById('map').style.background = value === 'blank' ? '#f9fafb' : '';

    document.querySelectorAll('.bm-option').forEach(function (opt) {
      opt.classList.toggle('active', opt.dataset.value === value);
    });
    document.getElementById('bibProvider').textContent = BASEMAP_LABELS[value] || '—';
  }

  document.querySelectorAll('.bm-option').forEach(function (opt) {
    opt.addEventListener('click', function () { setBasemap(this.dataset.value); });
  });

  document.getElementById('btnBasemap').addEventListener('click', function (e) {
    e.stopPropagation();
    const pop = document.getElementById('basemapPop');
    const isOpen = pop.style.display === 'block';
    pop.style.display = isOpen ? 'none' : 'block';
    this.classList.toggle('active', !isOpen);
    if (!isOpen) {
      /* posicionar el popover a la izquierda del botón que lo abrió */
      const btnRect = this.getBoundingClientRect();
      const canvasRect = document.getElementById('mapCanvas').getBoundingClientRect();
      pop.style.top   = (btnRect.top - canvasRect.top) + 'px';
      pop.style.right = (canvasRect.right - btnRect.left + 8) + 'px';
    }
  });

  document.addEventListener('click', function (e) {
    const pop = document.getElementById('basemapPop');
    if (pop.style.display === 'block' && !pop.contains(e.target) && e.target.id !== 'btnBasemap') {
      pop.style.display = 'none';
      document.getElementById('btnBasemap').classList.remove('active');
    }
  });

  setBasemap('sat'); /* estado inicial: satélite, igual que antes */

  /* Hamburger menu del navbar */
  (function () {
    const header = document.querySelector('header');
    const btn    = document.getElementById('navHamburger');
    const links  = document.getElementById('navLinks');
    if (!btn || !links) return;

    function checkFit() {
      header.classList.remove('mobile-nav');
      links.classList.remove('open');
      btn.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');

      links.style.cssText = 'display:flex;flex-direction:row;position:static;width:auto;visibility:hidden;';
      btn.style.display   = 'none';

      const navEl   = document.querySelector('nav');
      const brandEl = navEl.querySelector('.nav-brand');
      const gap     = 40;
      const fits    = brandEl.offsetWidth + gap + links.scrollWidth <= navEl.offsetWidth;

      links.style.cssText = '';
      btn.style.display   = '';

      if (!fits) header.classList.add('mobile-nav');
    }

    btn.addEventListener('click', function () {
      const isOpen = links.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
      btn.setAttribute('aria-expanded', isOpen);
    });

    links.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () {
        links.classList.remove('open');
        btn.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      });
    });

    document.addEventListener('click', function (e) {
      if (!btn.contains(e.target) && !links.contains(e.target)) {
        links.classList.remove('open');
        btn.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      }
    });

    checkFit();
    window.addEventListener('resize', checkFit);
  })();
}

<!-- ══════════════════════════════════════════════
     PANEL DE ANÁLISIS ESPACIAL (Turf.js)
     Opera sobre PROJECT_MARKERS (los 4 puntos reales de
     ubicación de tesis). No depende de capas/polígonos propios
     de cada proyecto porque esos aún no existen como datasets
     (ver PROJECTS[].capas, vacío) — así que las herramientas que
     necesitan un polígono (Buffer, Área, Punto-en-polígono,
     Intersección) lo generan ellas mismas a partir de los puntos.
     ══════════════════════════════════════════════ -->
<script>
window.TurfPanel = (function () {

  const TOOLS = {
    dist: {
      eyebrow: 'Medición',
      title: 'Distancia',
      desc: 'Calcula la distancia en línea recta entre dos puntos cualesquiera del mapa (marcadores, municipios o cualquier lugar), usando el radio terrestre.',
      hint: 'Haz clic en dos puntos del mapa.',
      needsPicking: true,
      picksNeeded: 2,
      pickAnywhere: true
    },
    area: {
      eyebrow: 'Medición',
      title: 'Área de cobertura',
      desc: 'Calcula el área del polígono envolvente (convex hull) que cubre todas las tesis activas en el mapa.',
      needsPicking: false
    },
    buff: {
      eyebrow: 'Transformación',
      title: 'Buffer',
      desc: 'Genera una zona de influencia circular alrededor de cualquier punto del mapa, al radio (km) que definas.',
      hint: 'Haz clic en cualquier punto del mapa.',
      needsPicking: true,
      picksNeeded: 1,
      pickAnywhere: true,
      showRadius: true
    },
    ctrd: {
      eyebrow: 'Transformación',
      title: 'Centroide',
      desc: 'Calcula el centro geométrico del conjunto de tesis activas en el mapa.',
      needsPicking: false
    },
    near: {
      eyebrow: 'Relación espacial',
      title: 'Punto más cercano',
      desc: 'Haz clic en cualquier punto del mapa y se identifica qué tesis está geográficamente más cerca.',
      hint: 'Haz clic en cualquier punto del mapa.',
      needsPicking: true,
      picksNeeded: 1,
      pickAnywhere: true
    },
    pip: {
      eyebrow: 'Relación espacial',
      title: 'Punto en polígono',
      desc: 'Verifica si un punto cae dentro del último buffer generado con la herramienta Buffer.',
      hint: 'Haz clic en cualquier punto del mapa.',
      needsPicking: true,
      picksNeeded: 1,
      pickAnywhere: true,
      requiresBuffer: true
    },
    intx: {
      eyebrow: 'Relación espacial',
      title: 'Intersección',
      desc: 'Genera un buffer de 20 km alrededor de dos puntos cualesquiera del mapa y comprueba si esas zonas de influencia se cruzan.',
      hint: 'Haz clic en dos puntos del mapa.',
      needsPicking: true,
      picksNeeded: 2,
      pickAnywhere: true
    },
    voro: {
      eyebrow: 'Agregación',
      title: 'Voronoi',
      desc: 'Divide el territorio en celdas: cada una agrupa el área más cercana a una tesis que a cualquier otra.',
      needsPicking: false
    }
  };

  let activeTool   = null;
  let picked       = [];        // marcadores (o coords) elegidos durante el picking
  let lastBuffer   = null;      // { turfPolygon, olFeature, markerIdx, radiusKm }
  let resultLayer  = null;      // capa OL donde se dibujan buffers/lineas/voronoi/centroide

  /* ── Utilidades ─────────────────────────────── */
  function fmtKm(km) {
    return km < 1 ? (km * 1000).toFixed(0) + ' m' : km.toFixed(2) + ' km';
  }
  function fmtKm2(km2) {
    return km2 < 0.01 ? (km2 * 1e6).toFixed(0) + ' m²' : km2.toFixed(2) + ' km²';
  }
  function markersAsFeatureCollection() {
    return turf.featureCollection(
      PROJECT_MARKERS.map(function (m) { return turf.point(m.coords, { lugar: m.lugar }); })
    );
  }
  function clearResultLayer() {
    if (resultLayer) resultLayer.getSource().clear();
  }
  function addOlFeatureFromTurf(turfGeom, style) {
    const olFeat = new ol.format.GeoJSON().readFeature(turfGeom, {
      featureProjection: 'EPSG:3857',
      dataProjection: 'EPSG:4326'
    });
    if (style) olFeat.setStyle(style);
    resultLayer.getSource().addFeature(olFeat);
    return olFeat;
  }
  function nearestMarkerFeature(coordLonLat) {
    /* Encuentra el marcador (PROJECT_MARKERS) más cercano a una coordenada */
    const from = turf.point(coordLonLat);
    const fc   = markersAsFeatureCollection();
    const near = turf.nearestPoint(from, fc);
    return { feature: near, idx: near.properties.featureIndex };
  }

  /* ── Capa de resultados (buffers, líneas, voronoi, centroide) ── */
  function ensureResultLayer() {
    if (resultLayer) return;
    resultLayer = new ol.layer.Vector({
      source: new ol.source.Vector(),
      zIndex: 4
    });
    map.addLayer(resultLayer);
  }

  const STYLE_LINE = new ol.style.Style({
    stroke: new ol.style.Stroke({ color: '#0F6E56', width: 2, lineDash: [6, 6] })
  });
  const STYLE_BUFFER = new ol.style.Style({
    fill:   new ol.style.Fill({ color: 'rgba(15,110,86,0.12)' }),
    stroke: new ol.style.Stroke({ color: '#0F6E56', width: 1.5 })
  });
  const STYLE_HULL = new ol.style.Style({
    fill:   new ol.style.Fill({ color: 'rgba(11,46,107,0.08)' }),
    stroke: new ol.style.Stroke({ color: '#0B2E6B', width: 1.5, lineDash: [3, 3] })
  });
  const STYLE_VORONOI = new ol.style.Style({
    fill:   new ol.style.Fill({ color: 'rgba(217,119,6,0.06)' }),
    stroke: new ol.style.Stroke({ color: '#d97706', width: 1 })
  });
  function styleForPoint(color) {
    return new ol.style.Style({
      image: new ol.style.Circle({
        radius: 7,
        fill:   new ol.style.Fill({ color: color }),
        stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 })
      })
    });
  }

  /* ── UI del panel ───────────────────────────── */
  function openPanel(key) {
    const t = TOOLS[key];
    document.getElementById('turfEyebrow').textContent = t.eyebrow;
    document.getElementById('turfTitle').textContent   = t.title;
    document.getElementById('turfDesc').textContent    = t.desc;

    const hintEl   = document.getElementById('turfHint');
    const resultEl = document.getElementById('turfResult');
    const radiusRow = document.getElementById('turfRadiusRow');

    hintEl.style.display    = 'none';
    resultEl.style.display  = 'none';
    radiusRow.style.display = t.showRadius ? 'flex' : 'none';

    if (t.hint) { hintEl.textContent = t.hint; hintEl.style.display = 'block'; }

    /* Alinear verticalmente el panel con el riel de Turf (que ya no está
       centrado, sino debajo de los controles del mapa) */
    const railEl   = document.getElementById('turfRail');
    const canvasEl = document.getElementById('mapCanvas');
    if (railEl && canvasEl) {
      const railRect   = railEl.getBoundingClientRect();
      const canvasRect = canvasEl.getBoundingClientRect();
      document.getElementById('turfPanel').style.top = (railRect.top - canvasRect.top) + 'px';
    }

    document.getElementById('turfPanel').classList.add('open');
  }

  function showResult(html) {
    const resultEl = document.getElementById('turfResult');
    resultEl.innerHTML = html;
    resultEl.style.display = 'block';
    document.getElementById('turfHint').style.display = 'none';
  }

  function setActiveButton(key) {
    document.querySelectorAll('.turf-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.tool === key);
    });
  }

  function resetPicking() {
    picked = [];
  }

  /* ── Selección de una herramienta ──────────── */
  function selectTool(key) {
    ensureResultLayer();

    if (activeTool === key) {
      /* clic sobre la misma herramienta activa: cerrar */
      deactivate();
      return;
    }

    activeTool = key;
    resetPicking();
    setActiveButton(key);
    openPanel(key);

    const t = TOOLS[key];
    if (!t.needsPicking) {
      runImmediateTool(key);
    }
  }

  function deactivate() {
    activeTool = null;
    resetPicking();
    setActiveButton(null);
    document.getElementById('turfPanel').classList.remove('open');
  }

  /* ── Herramientas inmediatas (sin picking) ─── */
  function runImmediateTool(key) {
    clearResultLayer();
    const fc = markersAsFeatureCollection();

    if (key === 'ctrd') {
      const c = turf.centroid(fc);
      addOlFeatureFromTurf(c, styleForPoint('#0B2E6B'));
      const coords = c.geometry.coordinates;
      map.getView().animate({ center: ol.proj.fromLonLat(coords), duration: 400 });
      showResult(
        '<b>Centroide</b> de las ' + PROJECT_MARKERS.length + ' tesis activas<br>' +
        'Lon: ' + coords[0].toFixed(5) + ' &nbsp; Lat: ' + coords[1].toFixed(5)
      );
    }

    if (key === 'area') {
      if (PROJECT_MARKERS.length < 3) {
        showResult('Se necesitan al menos 3 tesis con ubicación para calcular un área de cobertura (convex hull). Actualmente hay ' + PROJECT_MARKERS.length + '.');
        return;
      }
      const hull = turf.convex(fc);
      if (!hull) {
        showResult('No fue posible calcular un polígono envolvente con la disposición actual de las tesis.');
        return;
      }
      addOlFeatureFromTurf(hull, STYLE_HULL);
      const areaKm2 = turf.area(hull) / 1e6;
      showResult('<b>Área de cobertura</b> (convex hull)<br>' + fmtKm2(areaKm2));
    }

    if (key === 'voro') {
      if (PROJECT_MARKERS.length < 2) {
        showResult('Se necesitan al menos 2 tesis para generar celdas de Voronoi.');
        return;
      }
      const bbox = [-78.990935, -4.298187, -66.876326, 12.437303]; // extent Colombia
      const voro = turf.voronoi(fc, { bbox: bbox });
      let count = 0;
      voro.features.forEach(function (f) {
        if (!f) return;
        addOlFeatureFromTurf(f, STYLE_VORONOI);
        count++;
      });
      showResult('<b>Voronoi</b> generado<br>' + count + ' celdas — cada una representa el área del país más cercana a esa tesis que a cualquier otra.');
    }
  }

  /* ── Etiqueta descriptiva de un punto clickeado ──────────
     Prioridad: marcador de tesis > municipio > punto genérico.
     Solo se usa para el texto del resultado; el cálculo
     siempre usa la coordenada exacta del clic. ──────────── */
  function labelForClick(evt) {
    let label = null;

    map.forEachFeatureAtPixel(evt.pixel, function (feature) {
      if (label !== null) return;
      if (feature.get('isProjectMarker')) label = feature.get('lugar');
    }, { hitTolerance: 8 });

    if (label === null && window.MunicipioSearch && window.MunicipioSearch.getFeatureAtPixel) {
      const muniFeat = window.MunicipioSearch.getFeatureAtPixel(evt);
      if (muniFeat) label = muniFeat.properties.mpio_cnmbr;
    }

    return label || 'Punto en el mapa';
  }

  /* ── Clic en el mapa mientras hay picking activo ── */
  function handleMapClick(evt) {
    if (!activeTool) return false;
    const t = TOOLS[activeTool];
    if (!t.needsPicking) return false;

    const clickLonLat = ol.proj.toLonLat(evt.coordinate);
    const label = labelForClick(evt);

    picked.push({ coord: clickLonLat, label: label });

    if (picked.length < t.picksNeeded) {
      document.getElementById('turfHint').textContent =
        'Selecciona ' + (t.picksNeeded - picked.length) + ' más.';
      return true;
    }

    runPickedTool(activeTool);
    return true;
  }

  /* ── Herramientas que dependen de picking ──── */
  function runPickedTool(key) {
    clearResultLayer();

    if (key === 'dist') {
      const a = picked[0], b = picked[1];
      const from = turf.point(a.coord), to = turf.point(b.coord);
      const line = turf.lineString([a.coord, b.coord]);
      addOlFeatureFromTurf(line, STYLE_LINE);
      const km = turf.distance(from, to);
      showResult(
        '<b>Distancia</b><br>' + escHtml(a.label) + ' &harr; ' + escHtml(b.label) + '<br>' + fmtKm(km)
      );
      resetPicking();
    }

    if (key === 'near') {
      const clicked = picked[0].coord;
      const { feature, idx } = nearestMarkerFeature(clicked);
      const m = PROJECT_MARKERS[idx];
      const line = turf.lineString([clicked, m.coords]);
      addOlFeatureFromTurf(line, STYLE_LINE);
      addOlFeatureFromTurf(turf.point(clicked), styleForPoint('#d97706'));
      const km = turf.distance(turf.point(clicked), turf.point(m.coords));
      showResult('<b>Tesis más cercana</b><br>' + escHtml(m.lugar) + '<br>a ' + fmtKm(km) + ' del punto seleccionado');
      resetPicking();
    }

    if (key === 'pip') {
      if (!lastBuffer) {
        showResult('Aún no hay ningún buffer generado. Usa primero la herramienta <b>Buffer</b> sobre cualquier punto.');
        resetPicking();
        return;
      }
      addOlFeatureFromTurf(lastBuffer.turfPolygon, STYLE_BUFFER);
      const clicked = picked[0].coord;
      const inside = turf.booleanPointInPolygon(turf.point(clicked), lastBuffer.turfPolygon);
      addOlFeatureFromTurf(turf.point(clicked), styleForPoint(inside ? '#0F6E56' : '#dc2626'));
      showResult(
        'El punto seleccionado está <b>' + (inside ? 'DENTRO' : 'FUERA') + '</b> del buffer de ' +
        fmtKm(lastBuffer.radiusKm) + ' alrededor de ' + escHtml(lastBuffer.label)
      );
      resetPicking();
    }

    if (key === 'buff') {
      const radiusKm = parseFloat(document.getElementById('turfRadiusInput').value) || 20;
      generateBuffer(picked[0].coord, picked[0].label, radiusKm);
      resetPicking();
    }

    if (key === 'intx') {
      const a = picked[0], b = picked[1];
      const bufA = turf.buffer(turf.point(a.coord), 20, { units: 'kilometers' });
      const bufB = turf.buffer(turf.point(b.coord), 20, { units: 'kilometers' });
      addOlFeatureFromTurf(bufA, STYLE_BUFFER);
      addOlFeatureFromTurf(bufB, STYLE_BUFFER);
      const intersects = turf.booleanIntersects(bufA, bufB);
      let html = 'Buffers de 20 km alrededor de ' + escHtml(a.label) + ' y ' + escHtml(b.label) + '<br>' +
                 '<b>' + (intersects ? 'SÍ se intersectan' : 'NO se intersectan') + '</b>';
      if (intersects) {
        try {
          const inter = turf.intersect(bufA, bufB);
          if (inter) {
            addOlFeatureFromTurf(inter, new ol.style.Style({
              fill: new ol.style.Fill({ color: 'rgba(220,38,38,0.25)' }),
              stroke: new ol.style.Stroke({ color: '#dc2626', width: 1.5 })
            }));
            html += '<br>Área de intersección: ' + fmtKm2(turf.area(inter) / 1e6);
          }
        } catch (e) { /* geometrías muy pequeñas o degeneradas: se ignora el área */ }
      }
      showResult(html);
      resetPicking();
    }
  }

  function generateBuffer(coord, label, radiusKm) {
    const poly = turf.buffer(turf.point(coord), radiusKm, { units: 'kilometers' });
    addOlFeatureFromTurf(poly, STYLE_BUFFER);
    lastBuffer = { turfPolygon: poly, label: label, radiusKm: radiusKm };
    const areaKm2 = turf.area(poly) / 1e6;
    showResult(
      '<b>Buffer</b> de ' + fmtKm(radiusKm) + ' alrededor de ' + escHtml(label) + '<br>' +
      'Área: ' + fmtKm2(areaKm2)
    );
  }

  /* ── Wiring de UI (se llama una vez el DOM está listo) ─── */
  function initUIWiring() {
    document.querySelectorAll('.turf-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { selectTool(btn.dataset.tool); });
    });
    document.getElementById('turfPanelClose').addEventListener('click', deactivate);
    document.getElementById('turfRadiusBtn').addEventListener('click', function () {
      if (activeTool === 'buff' && picked.length) {
        const radiusKm = parseFloat(document.getElementById('turfRadiusInput').value) || 20;
        generateBuffer(picked[0].coord, picked[0].label, radiusKm);
      }
    });
  }

  window.addEventListener('load', function () {
    /* Se ejecuta después del load handler principal (registrado antes),
       por lo que `map` y `PROJECT_MARKERS` ya existen. */
    initUIWiring();
  });

  return { handleMapClick: handleMapClick };
})();
</script>

<!-- ══════════════════════════════════════════════
     BUSCADOR DE MUNICIPIOS (data/municipios.json)
     Carga un único TopoJSON nacional (1,122 municipios,
     fuente IGAC/DANE, WGS84) con hit-testing invisible.
     El croquis de un municipio solo se dibuja al buscarlo
     o hacer clic sobre él — nunca se muestran los 1,122 a
     la vez, a diferencia del borde nacional.
     ══════════════════════════════════════════════ -->
<script>
window.MunicipioSearch = (function () {

  const DATA_URL = '../data/municipios.json';

  let municipiosFC    = null;   // FeatureCollection GeoJSON (WGS84), tras descomprimir el TopoJSON
  let hitLayer         = null;  // capa invisible para detección de clic sobre los 1,122 polígonos
  let highlightLayer   = null;  // capa visible: solo los municipios actualmente seleccionados
  let selectedFeatures = [];    // selección activa (1 o varias, según Ctrl+clic)
  let deptoAreaTotals  = {};    // { [dpto_ccdgo]: área total del departamento en km² }

  const STYLE_INVISIBLE = new ol.style.Style({
    fill:   new ol.style.Fill({ color: 'rgba(0,0,0,0)' }),
    stroke: new ol.style.Stroke({ color: 'rgba(0,0,0,0)', width: 1 })
  });
  /* Un poco más visible que antes (grosor y opacidad levemente mayores) */
  const STYLE_HIGHLIGHT = new ol.style.Style({
    fill:   new ol.style.Fill({ color: 'rgba(15,110,86,0.24)' }),
    stroke: new ol.style.Stroke({ color: '#0F6E56', width: 2.75 })
  });

  function stripAccents(str) {
    return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }
  function fmtKm2(km2) {
    return km2 < 0.01 ? (km2 * 1e6).toFixed(0) + ' m²' : km2.toLocaleString('es-CO', { maximumFractionDigits: 1 }) + ' km²';
  }
  function fmtPct(pct) {
    return pct.toLocaleString('es-CO', { maximumFractionDigits: 1 }) + '%';
  }
  function keyOf(f) { return f.properties.mpio_ccnct; } // código DIVIPOLA de municipio, único

  /* ── Carga del TopoJSON + construcción de capas ─────────── */
  function init() {
    fetch(DATA_URL)
      .then(function (r) { return r.json(); })
      .then(function (topo) {
        const key = Object.keys(topo.objects)[0];
        municipiosFC = topojson.feature(topo, topo.objects[key]);

        /* Área total por departamento, calculada una sola vez sumando
           el área (Turf) de todos sus municipios — no requiere ningún
           dataset adicional de límites departamentales. */
        municipiosFC.features.forEach(function (f) {
          const d = f.properties.dpto_ccdgo;
          const a = turf.area(f) / 1e6;
          deptoAreaTotals[d] = (deptoAreaTotals[d] || 0) + a;
        });

        const gjFormat = new ol.format.GeoJSON();
        const olFeatures = gjFormat.readFeatures(municipiosFC, {
          featureProjection: 'EPSG:3857',
          dataProjection: 'EPSG:4326'
        });
        /* índice de vuelta a la feature GeoJSON original (para turf.area) */
        olFeatures.forEach(function (f, i) { f.set('__muniIndex', i); });

        hitLayer = new ol.layer.Vector({
          source: new ol.source.Vector({ features: olFeatures }),
          style: STYLE_INVISIBLE,
          zIndex: 2
        });
        highlightLayer = new ol.layer.Vector({
          source: new ol.source.Vector(),
          style: STYLE_HIGHLIGHT,
          zIndex: 2
        });
        map.addLayer(hitLayer);
        map.addLayer(highlightLayer);
      })
      .catch(function (err) {
        console.error('No se pudo cargar data/municipios.json:', err);
      });

    wireSearchBox();
  }

  /* ── Utilidad interna: feature de municipio bajo un pixel ── */
  function findMunicipioAtPixel(evt) {
    if (!hitLayer) return null;
    let hit = null;
    map.forEachFeatureAtPixel(evt.pixel, function (feature, layer) {
      if (layer === hitLayer) hit = feature;
    }, { hitTolerance: 2 });
    if (!hit) return null;
    return municipiosFC.features[hit.get('__muniIndex')];
  }

  /* ── Render de capa resaltada + badge, a partir de selectedFeatures ── */
  function renderSelection(fitView) {
    highlightLayer.getSource().clear();
    const gjFormat = new ol.format.GeoJSON();

    if (selectedFeatures.length === 0) {
      document.getElementById('muniBadge').classList.remove('open');
      return;
    }

    let combinedExtent = null;
    selectedFeatures.forEach(function (gf) {
      const olFeat = gjFormat.readFeature(gf, { featureProjection: 'EPSG:3857', dataProjection: 'EPSG:4326' });
      highlightLayer.getSource().addFeature(olFeat);
      const ext = olFeat.getGeometry().getExtent();
      combinedExtent = combinedExtent ? ol.extent.extend(combinedExtent, ext) : ext.slice();
    });

    if (fitView && combinedExtent) {
      map.getView().fit(combinedExtent, { padding: [60, 60, 60, 60], duration: 400, maxZoom: 12 });
    }

    renderBadge();
  }

  function renderBadge() {
    const listEl = document.getElementById('muniBadgeList');
    listEl.innerHTML = '';

    selectedFeatures.forEach(function (gf) {
      const p = gf.properties;
      const areaKm2   = turf.area(gf) / 1e6;
      const deptoArea = deptoAreaTotals[p.dpto_ccdgo] || 0;
      const pct       = deptoArea > 0 ? (areaKm2 / deptoArea) * 100 : 0;

      const card = document.createElement('div');
      card.className = 'muni-card';
      card.innerHTML =
        '<button class="muni-card-remove" title="Quitar"><i class="fa-solid fa-xmark"></i></button>' +
        '<div class="muni-card-name">' + escHtml(p.mpio_cnmbr) + '</div>' +
        '<div class="muni-card-depto">' + escHtml(p.dpto_cnmbr) + ' · Depto. DIVIPOLA ' + escHtml(p.dpto_ccdgo) +
          ' · Mpio. ' + escHtml(p.mpio_ccnct) + '</div>' +
        '<div class="muni-card-area"><i class="fa-solid fa-draw-polygon"></i> ' + fmtKm2(areaKm2) +
          ' &nbsp;·&nbsp; ' + fmtPct(pct) + ' del departamento</div>';
      card.querySelector('.muni-card-remove').addEventListener('click', function (e) {
        e.stopPropagation();
        removeFromSelection(keyOf(gf));
      });
      listEl.appendChild(card);
    });

    document.getElementById('muniBadgeClearAll').style.display = selectedFeatures.length > 1 ? 'block' : 'none';
    document.getElementById('muniBadge').classList.add('open');
  }

  /* ── Operaciones de selección ─────────────────────────── */
  function replaceSelection(geojsonFeature) {
    selectedFeatures = [geojsonFeature];
    renderSelection(true);
  }
  function toggleInSelection(geojsonFeature) {
    const k = keyOf(geojsonFeature);
    const i = selectedFeatures.findIndex(function (f) { return keyOf(f) === k; });
    if (i !== -1) selectedFeatures.splice(i, 1);
    else selectedFeatures.push(geojsonFeature);
    renderSelection(selectedFeatures.length > 0);
  }
  function removeFromSelection(k) {
    selectedFeatures = selectedFeatures.filter(function (f) { return keyOf(f) !== k; });
    renderSelection(false);
  }
  function clearSelection() {
    selectedFeatures = [];
    if (highlightLayer) highlightLayer.getSource().clear();
    document.getElementById('muniBadge').classList.remove('open');
  }

  /* ── Clic directo sobre el mapa ────────────────────────
     Clic normal  → selecciona solo ese municipio.
     Ctrl/Cmd+clic → lo agrega o lo quita de la selección. ── */
  function handleMapClick(evt) {
    const feature = findMunicipioAtPixel(evt);
    if (!feature) return false;

    const isMulti = !!(evt.originalEvent && (evt.originalEvent.ctrlKey || evt.originalEvent.metaKey));
    if (isMulti) toggleInSelection(feature);
    else replaceSelection(feature);
    return true;
  }

  /* ── API expuesta para otros módulos (p. ej. TurfPanel) ── */
  function getFeatureAtPixel(evt) {
    return findMunicipioAtPixel(evt);
  }

  /* ── Buscador por nombre ──────────────────────────────────── */
  function wireSearchBox() {
    const input   = document.getElementById('muniSearchInput');
    const resultsEl = document.getElementById('muniSearchResults');

    input.addEventListener('input', function () {
      const q = stripAccents(input.value.trim());
      if (!municipiosFC || q.length < 2) {
        resultsEl.classList.remove('open');
        resultsEl.innerHTML = '';
        return;
      }

      const matches = municipiosFC.features
        .filter(function (f) { return stripAccents(f.properties.mpio_cnmbr).indexOf(q) !== -1; })
        .slice(0, 8);

      resultsEl.innerHTML = '';
      if (matches.length === 0) {
        resultsEl.innerHTML = '<div class="muni-search-empty">Sin resultados para "' + escHtml(input.value) + '"</div>';
      } else {
        matches.forEach(function (f) {
          const p = f.properties;
          const item = document.createElement('div');
          item.className = 'muni-result-item';
          item.innerHTML =
            '<div class="muni-result-name">' + escHtml(p.mpio_cnmbr) + '</div>' +
            '<div class="muni-result-depto">' + escHtml(p.dpto_cnmbr) + '</div>';
          item.addEventListener('click', function () {
            replaceSelection(f);
            resultsEl.classList.remove('open');
            input.value = p.mpio_cnmbr;
          });
          resultsEl.appendChild(item);
        });
      }
      resultsEl.classList.add('open');
    });

    document.addEventListener('click', function (e) {
      if (!input.contains(e.target) && !resultsEl.contains(e.target)) {
        resultsEl.classList.remove('open');
      }
    });

    document.getElementById('muniBadgeClearAll').addEventListener('click', clearSelection);

    const infoBtn = document.getElementById('muniInfoBtn');
    if (infoBtn) {
      infoBtn.addEventListener('click', function () {
        window.open('metadatos-municipios.html', '_blank', 'noopener');
      });
    }
  }

  window.addEventListener('load', init);

  return { handleMapClick: handleMapClick, getFeatureAtPixel: getFeatureAtPixel };
})();
</script>
</body>
</html>
